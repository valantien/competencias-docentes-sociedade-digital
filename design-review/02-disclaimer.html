<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 1B — Disclaimer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Roboto+Condensed:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1B18;
    --paper:#EFE3D1;
    --orange:#C1541F;
    --orange-deep:#8F3B15;
    --line:#E6DCD0;
    --muted:#8A7F73;
    --sans:"Roboto Condensed",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Fraunces",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#241B14}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--sans)}
  .stage{
    position:relative;width:1280px;height:720px;background:var(--paper);overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45);border-radius:6px;
  }
  .s-head{position:absolute;top:52px;left:68px;right:68px}
  .eyebrow{
    display:flex;align-items:center;gap:12px;margin-bottom:8px;color:var(--orange);
    font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  }
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--orange)}
  .s-title{font-family:var(--serif);font-size:2rem;font-weight:500;color:var(--orange-deep);line-height:1.1}
  .accent-rule{height:3px;width:100%;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,var(--orange-deep),var(--orange) 45%,transparent)}
  .meme-wrap{
    position:absolute;top:154px;left:60px;right:60px;bottom:54px;display:flex;
    align-items:center;justify-content:center;
  }
  .meme-wrap img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
</style>
</head>
<body>
<div class="stage">
  <div class="s-head">
    <div class="eyebrow">Antes de começar</div>
    <h1 class="s-title">Disclaimer — Sincronizar os significados</h1>
    <div class="accent-rule"></div>
  </div>
  <div class="meme-wrap">
    <img src="../assets/meme1.png" alt="Meme sobre discordância e abordagem semântico-cognitiva">
  </div>
</div>
</body>
</html>
